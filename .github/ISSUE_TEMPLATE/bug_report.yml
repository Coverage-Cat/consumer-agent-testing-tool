name: Bug report
description: Report a reproducible problem with the testing tool.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow SECURITY.md instead. Do not attach credentials, raw runs/,
        private/ directories, or service logs. Even exported runs need review before sharing.
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a synthetic scenario and a loopback service where possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit or version, OS, Python, Node, and the command's exit code.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I reviewed this report and its attachments for secrets and personal data.
          required: true
