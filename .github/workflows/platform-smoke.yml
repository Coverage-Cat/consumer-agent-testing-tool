# Short, manual diagnostics for platform failures. This does not replace required CI.
name: platform-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-smoke-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: uv sync --locked --extra openrouter --extra dev
      - run: npm --prefix tooling/payment-ui ci --ignore-scripts
      - name: Install Chromium
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            node tooling/payment-ui/node_modules/playwright/cli.js install --with-deps chromium
          else
            node tooling/payment-ui/node_modules/playwright/cli.js install chromium
          fi
      - name: Probe fixture shutdown with thread diagnostics
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          import signal
          import subprocess
          import sys
          import tempfile

          from consumer_agent_testing_tool.protocol import child_environment

          print("Inherited signal mask:", signal.pthread_sigmask(signal.SIG_BLOCK, []), flush=True)
          Path(".cache").mkdir(exist_ok=True)
          with tempfile.TemporaryDirectory(dir=".cache", prefix="shutdown-") as work:
              for number in (signal.SIGINT, signal.SIGTERM):
                  code = (
                      "import faulthandler, runpy; "
                      "faulthandler.dump_traceback_later(8, repeat=True); "
                      "runpy.run_module('consumer_agent_testing_tool.reservation_http', run_name='__main__')"
                  )
                  command = [
                      sys.executable, "-c", code, "--database", f"{work}/state.sqlite",
                      "--control", f"{work}/control.sock", "--run-id", "ci-shutdown", "--port", "0",
                  ]
                  process = subprocess.Popen(
                      command, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
                      env=child_environment(),
                  )
                  try:
                      startup = process.stdout.readline()
                      assert json.loads(startup)["origin"].startswith("http://127.0.0.1:")
                      process.send_signal(number)
                      output, error = process.communicate(timeout=15)
                      print(f"{number.name}: exit {process.returncode}\n{error}", flush=True)
                      assert process.returncode == 0
                  finally:
                      if process.poll() is None:
                          process.kill()
                      output, error = process.communicate()
                      if error:
                          print(error, flush=True)
          PY
      - name: Test browser startup, sockets, timeouts and process cleanup
        run: >-
          uv run --no-sync pytest -v -p no:cacheprovider -o faulthandler_timeout=90
          --durations=20 --junitxml=reports/platform-smoke.xml
          tests/test_fixture_http.py tests/test_socket_paths.py tests/test_surface_browser.py tests/test_browser_mcp.py
          tests/test_mcp_clients_sdk.py tests/test_reservation_http.py tests/test_reservation_jobs_http.py
          tests/test_scenario_resume.py tests/test_process.py tests/test_inspect_display.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: platform-smoke-${{ matrix.os }}-${{ matrix.python }}
          path: reports/platform-smoke.xml
          retention-days: 7
          if-no-files-found: warn
