[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "consumer-agent-testing-tool"
version = "0.2.1"
description = "Test your service with Muse and Instinct consumer-assistant surrogates"
readme = "README.md"
authors = [{name = "Coverage Cat, Inc."}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
]
requires-python = ">=3.12"
dependencies = [
  "inspect-ai==0.3.273",
  "mcp==2.2.0",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
  "httpx==0.28.1",
  "httpx2==2.13.1",
  "aiohttp==3.14.4",
  "certifi==2026.10.19",
]

[project.optional-dependencies]
openrouter = ["openai==3.1.0"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9"]

[dependency-groups]
development-extensions = [
  "gguf==0.19.0", "schemathesis==4.30.1", "fastmcp==4.1.0",
  "boto3==1.43.106", "aiobotocore==3.9.2", "botocore==1.43.106",
]

[project.scripts]
consumer-agent-testing-tool = "consumer_agent_testing_tool.cli:main"

[project.urls]
Repository = "https://github.com/Coverage-Cat/consumer-agent-testing-tool"
Issues = "https://github.com/Coverage-Cat/consumer-agent-testing-tool/issues"
Changelog = "https://github.com/Coverage-Cat/consumer-agent-testing-tool/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/consumer_agent_testing_tool"]

[tool.hatch.build.targets.wheel.force-include]
"uv.lock" = "consumer_agent_testing_tool/data/locks/uv.lock"
"third_party" = "consumer_agent_testing_tool/data/third_party"

[tool.hatch.build.targets.sdist]
only-include = [
  "src", "README.md", "LICENSE", "TRADEMARKS.md", "CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md",
  "CHANGELOG.md", "pyproject.toml", "uv.lock", "schemas", "docs",
  "scripts", "tests", "examples", "containers", ".dockerignore", "third_party",
  "tooling/package.json", "tooling/package-lock.json",
  "tooling/payment-ui/package.json", "tooling/payment-ui/package-lock.json",
  "tooling/payment-ui/checkout-config.mjs", "tooling/payment-ui/checkout.mjs",
  "tooling/payment-ui/blackbox-checkout.mjs", "tooling/payment-ui/README.md",
  "tooling/api/package.json", "tooling/api/package-lock.json", "tooling/api/.npmrc",
  "tooling/api/stubs",
  "tooling/build-python/pyproject.toml", "tooling/build-python/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "error::pytest.PytestUnraisableExceptionWarning",
  "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
