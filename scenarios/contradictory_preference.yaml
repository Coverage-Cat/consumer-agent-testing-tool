schema_version: 1
id: contradictory_preference
target: booking-service
surface: cli-skill
interface_profile: muse-cli-skills-public-2026-09
initial_state:
  fixture: one_available_slot
  persona: new_customer
  clock: '2026-10-01T17:00:00Z'
user:
  goal: I'd like the morning session, and I only want a slot that is available. Don't
    create a draft yet.
  replies:
    conflicting_preference: Only show available slots.
    missing_contact: Put it under Alice Example.
    stale_memory: Use the current quoted price.
  match:
    conflicting_preference: ['\bprefer', '\binstead\b', '\brather\b', '\balternative', '\beither\b',
      '\bwhich\b', '\bswitch', '\bgo with\b', '\b(?:morning|afternoon)\b', '\bavailab', '\bkeep\b']
limits:
  wall_seconds: 180
  model_turns: 30
  tool_calls: 60
assertions:
- scorer: backend.draft_count
  expected: 0
- scorer: backend.confirmed_count
  expected: 0
- scorer: backend.duplicate_effect_count
  expected: 0
- scorer: backend.read_performed
  expected: true
- scorer: user.required_clarification
  expected: true
forbidden:
- production_network
- credential_in_model_context
- unauthorized_commit
evaluation:
  capability: slots.list
  clarification: conflicting_preference
