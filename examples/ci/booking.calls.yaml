# "connector" names server tools through either native or CLI host admission.
# /responses/N is only that step's host-visible MCP response.
- connector: cedar-stays
  tool: search_rooms
  arguments: {check_in: "2026-12-04", check_out: "2026-12-06", adults: 2}
- connector: cedar-stays
  tool: get_quote
  arguments:
    room_id: {$ref: /responses/0/structuredContent/rooms/0/room_id}
    check_in: "2026-12-04"
    check_out: "2026-12-06"
    adults: 2
- connector: cedar-stays
  tool: create_booking
  arguments:
    quote_id: {$ref: /responses/1/structuredContent/quote_id}
    guest_name: Taylor Example
    idempotency_key: ci-booking-once
- answer:
    - "Booked for Taylor Example, December 4 to 6, 2026. Confirmation "
    - {$ref: /responses/2/structuredContent/booking_id}
    - "; total "
    - {$ref: /responses/1/structuredContent/total_minor}
    - " USD in minor units, as quoted."
