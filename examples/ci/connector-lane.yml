# GitHub Actions template: test your MCP server through the connector lane in your service's own CI.
# Copy it to .github/workflows/connector-lane.yml in your repository and replace each TODO.
#
# - Pull requests run the scripted calls (no model, no key, deterministic) and the guidelines readiness review.
# - Agent trials require explicit opt-in and an OPENROUTER_API_KEY secret. They incur model charges.
#
# The tool is installed from a pinned checkout of its repository. Each job uploads JUnit and summary JSON
# only. The sealed runs under runs/ hold host-private values in private/, so do not upload them; share
# `consumer-agent-testing-tool export RUN` output instead.
name: connector-lane

on:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      run_agent_trials:
        description: Run paid model trials
        type: boolean
        default: false
      trials:
        description: Agent trials per treatment
        type: number
        default: 5

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TOOL_REPOSITORY: Coverage-Cat/consumer-agent-testing-tool
  TOOL_REF: TODO                                      # TODO: a reviewed, full 40-character commit SHA
  CATT: .consumer-agent-testing-tool/.venv/bin/consumer-agent-testing-tool
  # TODO: the command that starts your server on {port}; it also receives PORT in its environment.
  START: "python -m my_service --host 127.0.0.1 --port {port}"
  SCENARIO: tests/connector/my-connector.yaml          # TODO: written with `scaffold`, then reviewed
  CALLS: tests/connector/my-connector.calls.json       # TODO: or `scaffold --from-run` of a trusted trial
  MANIFEST: tests/connector/readiness.yaml             # TODO: your readiness declarations

jobs:
  scripted:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require an immutable tool revision
        run: '[[ "$TOOL_REF" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TOOL_REPOSITORY }}
          ref: ${{ env.TOOL_REF }}
          path: .consumer-agent-testing-tool
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"
          python-version: "3.14"
      # TODO: install your service's own dependencies here.
      - name: Install the tool
        run: uv sync --project .consumer-agent-testing-tool --locked --no-dev

      - name: Scripted connector run
        run: >-
          "$CATT" connector-run "$SCENARIO"
          --driver scripted --script "$CALLS" --start "$START"
          --junit reports/scripted.xml --summary-json reports/scripted.json

      - name: Same calls under strict output schemas
        # A result that breaks a tool's outputSchema fails here, as it would under the official MCP SDK.
        run: >-
          "$CATT" connector-run "$SCENARIO"
          --driver scripted --script "$CALLS" --start "$START" --output-schema strict
          --junit reports/scripted-strict.xml

      - name: Guidelines readiness review
        # Reuse the tool's bounded startup and process-group cleanup.
        run: |
          .consumer-agent-testing-tool/.venv/bin/python - <<'PY'
          import asyncio
          import os
          from pathlib import Path
          from consumer_agent_testing_tool.service_start import started

          async def main():
              endpoint = "http://127.0.0.1:8080/mcp"  # TODO: your MCP path
              async with started(os.environ["START"], port=8080, output=Path("runs"),
                                 ready_url=endpoint, timeout=30, environment={"PORT": "8080"}):
                  process = await asyncio.create_subprocess_exec(
                      os.environ["CATT"], "check", endpoint, "--suite", "muse-guidelines",
                      "--manifest", os.environ["MANIFEST"], "--junit", "reports/readiness.xml")
                  return await process.wait()

          raise SystemExit(asyncio.run(main()))
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: connector-lane-scripted
          path: reports/
          retention-days: 14

  agent-trials:
    if: >-
      (github.event_name == 'schedule' && vars.ENABLE_SCHEDULED_AGENT_TRIALS == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_agent_trials)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The treatments a Muse-like host may use; the run lock records each.
        treatment:
          - ""
          - "--projection muse-cli"
          - "--exposure search-only"
          - "--client-profile muse-template-unofficial-2026-10"
    steps:
      - name: Require a model key for requested paid trials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "Paid trials were requested, but OPENROUTER_API_KEY is not set." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require an immutable tool revision
        run: '[[ "$TOOL_REF" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TOOL_REPOSITORY }}
          ref: ${{ env.TOOL_REF }}
          path: .consumer-agent-testing-tool
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"
          python-version: "3.14"
      # TODO: install your service's own dependencies here.
      - name: Install the tool
        run: uv sync --project .consumer-agent-testing-tool --locked --no-dev --extra openrouter
      - name: Agent trials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRIALS: ${{ inputs.trials || 5 }}
          TREATMENT: ${{ matrix.treatment }}
        # TODO: commit a model profile written by `consumer-agent-testing-tool init` (it holds no key; the key
        # comes from the environment). Declare reset: in the scenario so each trial starts fresh.
        run: |
          read -r -a treatment <<< "$TREATMENT"
          "$CATT" connector-run "$SCENARIO" --config tests/connector/agent.yaml \
            --trials "$TRIALS" "${treatment[@]}" --start "$START" \
            --junit reports/agent.xml --summary-json reports/agent.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: connector-lane-agent-${{ strategy.job-index }}
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
