# GitHub Actions template: test your MCP server through the connector lane in your service's own CI.
# Copy it to .github/workflows/connector-lane.yml in your repository and replace each TODO.
#
# - Pull requests run a declared suite of scripted cases and shared surrogate readiness, with no model or key.
# - Agent trials require explicit opt-in and an OPENROUTER_API_KEY secret. They incur model charges.
#
# The tool is installed from a pinned checkout of its repository. Each job uploads JUnit and summary JSON
# only. The sealed runs under .cache/catt-ci/ hold host-private values, so do not upload them; share
# `consumer-agent-testing-tool export RUN` output instead.
name: connector-lane

on:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      run_agent_trials:
        description: Run paid model trials
        type: boolean
        default: false
      trials:
        description: Agent trials per treatment
        type: number
        default: 5

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TOOL_REPOSITORY: Coverage-Cat/consumer-agent-testing-tool
  TOOL_REF: TODO                                      # TODO: a reviewed, full 40-character commit SHA
  CATT: .consumer-agent-testing-tool/.venv/bin/consumer-agent-testing-tool
  SUITE: tests/connector/compatibility.suite.yaml      # TODO: copy examples/ci/booking.suite.yaml and review
  # These two settings are used only by the optional paid job.
  START: "python -m my_service --host 127.0.0.1 --port {port}"
  SCENARIO: tests/connector/my-connector.yaml          # TODO: written with `scaffold`, then reviewed

jobs:
  scripted:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require an immutable tool revision
        run: '[[ "$TOOL_REF" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TOOL_REPOSITORY }}
          ref: ${{ env.TOOL_REF }}
          path: .consumer-agent-testing-tool
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            .consumer-agent-testing-tool/uv.lock
            uv.lock
      # TODO: install your service's own dependencies here.
      - name: Install the tool
        run: uv sync --project .consumer-agent-testing-tool --locked --no-dev

      - name: Validate all cases before starting any service
        run: '"$CATT" ci validate "$SUITE" --jobs 2 --json'
      - name: Scripted suite shard
        env:
          SHARD: ${{ matrix.shard }}/2
          BATCH_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          BUILD_ID: ${{ github.sha }}
        run: >-
          "$CATT" ci run "$SUITE" --jobs 2 --shard "$SHARD"
          --batch-id "$BATCH_ID" --build-id "$BUILD_ID" --report-dir reports/scripted

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: connector-lane-scripted-${{ matrix.shard }}
          path: |
            reports/scripted/report.json
            reports/scripted/junit.xml
          retention-days: 14
          if-no-files-found: warn

  # Make this the required check: it cannot pass with a missing, stale, duplicate or failed shard.
  scripted-gate:
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    needs: [scripted]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require an immutable tool revision
        run: '[[ "$TOOL_REF" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TOOL_REPOSITORY }}
          ref: ${{ env.TOOL_REF }}
          path: .consumer-agent-testing-tool
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: .consumer-agent-testing-tool/uv.lock
      - run: uv sync --project .consumer-agent-testing-tool --locked --no-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: connector-lane-scripted-*
          path: reports/shards
      - name: Merge every shard
        run: '"$CATT" ci merge reports/shards/*/report.json --report-dir reports/merged'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: connector-lane-gate
          path: |
            reports/merged/report.json
            reports/merged/junit.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Require successful shard jobs
        if: always()
        env:
          SCRIPTED_RESULT: ${{ needs.scripted.result }}
        run: |
          if [[ "$SCRIPTED_RESULT" != "success" ]]; then
            echo "Every scripted shard job must succeed. Select Re-run all jobs to rerun this gate." >&2
            exit 1
          fi

  agent-trials:
    if: >-
      (github.event_name == 'schedule' && vars.ENABLE_SCHEDULED_AGENT_TRIALS == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_agent_trials)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [muse, instinct]
        projection: [native, cli]
    steps:
      - name: Require a model key for requested paid trials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "Paid trials were requested, but OPENROUTER_API_KEY is not set." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require an immutable tool revision
        run: '[[ "$TOOL_REF" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TOOL_REPOSITORY }}
          ref: ${{ env.TOOL_REF }}
          path: .consumer-agent-testing-tool
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.14"
      # TODO: install your service's own dependencies here.
      - name: Install the tool
        run: uv sync --project .consumer-agent-testing-tool --locked --no-dev --extra openrouter
      - name: Agent trials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRIALS: ${{ inputs.trials || 5 }}
          EMULATION_TARGET: ${{ matrix.target }}
          PROJECTION: ${{ matrix.projection }}
        # TODO: commit a model profile written by `consumer-agent-testing-tool init` (it holds no key; the key
        # comes from the environment). Declare reset: in the scenario so each trial starts fresh.
        run: |
          "$CATT" connector-run "$SCENARIO" --config tests/connector/agent.yaml \
            --trials "$TRIALS" --emulation-target "$EMULATION_TARGET" --projection "$PROJECTION" \
            --client-profile generic-sdk --start "$START" \
            --junit reports/agent.xml --summary-json reports/agent.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: connector-lane-agent-${{ strategy.job-index }}
          path: |
            reports/agent.json
            reports/agent.xml
          retention-days: 7
          if-no-files-found: ignore
