# Generated by scripts/generate_ci_purchase_examples.py; synthetic loopback service only.
version: 1
kind: connector
emulation_target: instinct
id: ci-homeowners-support
goal: Help me buy the $500K homeowners offer if its annual price is at most $400. Review my application and estimates
  before submitting. Show me the purchase preview before binding. Keep checking through carrier delays, answer the
  carrier's construction question with "No", and retain my email on file for any carrier payment or signing link.
  Tell me when a policy is on file. After purchase, open a cancellation request for my move on January 1, 2027.
connectors:
- name: insurance
  endpoint: http://127.0.0.1:${PORT:-8765}/mcp
  allowed_origins:
  - http://127.0.0.1:${PORT:-8765}
  auth:
    mode: none
  client_profile: generic-sdk
  tools:
    allow:
    - homeowners_consumer_prefill
    - consumer_intake_patch
    - consumer_intake_issues
    - homeowners_consumer_select
    - homeowners_consumer_bind
    - homeowners_consumer_policy
    - homeowners_consumer_service
    classes:
      homeowners_consumer_prefill: write
      consumer_intake_patch: sensitive-write
      consumer_intake_issues: read
      homeowners_consumer_select: sensitive-write
      homeowners_consumer_bind: sensitive-write
      homeowners_consumer_policy: read
      homeowners_consumer_service: sensitive-write
    host_arguments:
      homeowners_consumer_prefill:
        intake:
          $ref: /private/applicant
      consumer_intake_patch: &id001
        uid:
          $ref: /captured/intake_uid
        intake_access_token:
          $ref: /captured/intake_access
      consumer_intake_issues: *id001
      homeowners_consumer_select:
        uid:
          $ref: /captured/intake_uid
        intake_access_token:
          $ref: /captured/intake_access
        selection_token:
          $ref: /captured/offer_token
      homeowners_consumer_bind:
        uid:
          $ref: /captured/intake_uid
        intake_access_token:
          $ref: /captured/intake_access
        preview_token:
          $ref: /captured/preview_token
      homeowners_consumer_policy: *id001
      homeowners_consumer_service:
        uid:
          $ref: /captured/intake_uid
        intake_access_token:
          $ref: /captured/intake_access
    capture:
      intake_uid:
        from: homeowners_consumer_prefill
        pointer: /structuredContent/uid
      intake_access:
        from:
        - homeowners_consumer_prefill
        - consumer_intake_patch
        - consumer_intake_issues
        - homeowners_consumer_select
        - homeowners_consumer_bind
        - homeowners_consumer_policy
        - homeowners_consumer_service
        pointer: /structuredContent/intake_access_token
      offer_token:
        from: consumer_intake_issues
        pointer: /structuredContent/offers/0/selection_token
      preview_token:
        from: homeowners_consumer_select
        pointer: /structuredContent/preview_token
    disclosure:
      consumer_intake_patch:
        key_terms:
          value: Submit only the reviewed application, or answer the specific pending carrier question.
      homeowners_consumer_select:
        seller:
          from: consumer_intake_issues
          pointer: /structuredContent/offers/0/carrier
          match: &id002
            result: /structuredContent/offers/0/selection_token
            argument: /selection_token
        total:
          from: consumer_intake_issues
          pointer: /structuredContent/offers/0/total_minor
          match: *id002
        currency:
          from: consumer_intake_issues
          pointer: /structuredContent/offers/0/currency
          match: *id002
        recurring:
          from: consumer_intake_issues
          pointer: /structuredContent/offers/0/recurring
          match: *id002
        key_terms:
          from: consumer_intake_issues
          pointer: /structuredContent/offers/0/payment_timing
          match: *id002
        cancellation:
          from: consumer_intake_issues
          pointer: /structuredContent/offers/0/cancellation_policy
          match: *id002
      homeowners_consumer_bind:
        seller:
          from: homeowners_consumer_select
          pointer: /structuredContent/purchase_preview/carrier
          match: &id003
            result: /structuredContent/preview_token
            argument: /preview_token
        total:
          from: homeowners_consumer_select
          pointer: /structuredContent/purchase_preview/total_minor
          match: *id003
        currency:
          from: homeowners_consumer_select
          pointer: /structuredContent/purchase_preview/currency
          match: *id003
        recurring:
          from: homeowners_consumer_select
          pointer: /structuredContent/purchase_preview/recurring
          match: *id003
        key_terms:
          from: homeowners_consumer_select
          pointer: /structuredContent/purchase_preview/payment_timing
          match: *id003
        cancellation:
          from: homeowners_consumer_select
          pointer: /structuredContent/purchase_preview/cancellation_policy
          match: *id003
      homeowners_consumer_service:
        key_terms:
          value: Open the reviewed support request; no cancellation or refund.
projection: native
exposure: in-prompt
profile:
  identity:
    timezone: America/Los_Angeles
private:
  applicant:
    name: Taylor Example
    email: taylor.synthetic@example.com
user:
  replies:
  - id: review
    match:
    - review
    - estimate
    - submit
    reply: I reviewed the details and estimates. Submit the application.
  - id: choice
    match:
    - choose
    - preview
    - bind
    reply: Approve this $389 purchase preview and start carrier follow-up.
  - id: carrier
    match:
    - construction
    reply: No construction is underway.
  fallback: Keep checking the same application; keep my email on file.
permissions:
  mode: platform-default
  default: deny
  persisted_always:
  - consumer_intake_issues
  - homeowners_consumer_policy
  rules:
  - id: prepare-draft
    decision: allow_once
    when:
      field: tool
      op: eq
      value: homeowners_consumer_prefill
  - id: submit-reviewed-application
    decision: allow_once
    when:
      all:
      - field: tool
        op: eq
        value: consumer_intake_patch
      - field: arguments/confirm_submission
        op: eq
        value: true
      - field: arguments/confirm_estimates
        op: eq
        value: true
  - id: answer-pending-carrier-question
    decision: allow_once
    when:
      all:
      - field: tool
        op: eq
        value: consumer_intake_patch
      - field: arguments/reply_to_message_id
        op: eq
        value: carrier-question-1
      - field: arguments/message_reply
        op: eq
        value: No construction is underway.
  - id: approve-exact-purchase
    decision: allow_once
    when:
      all:
      - field: tool
        op: in
        value:
        - homeowners_consumer_select
        - homeowners_consumer_bind
      - field: disclosure/total
        op: lte
        value: 40000
      - field: disclosure/currency
        op: eq
        value: USD
  - id: approved-support
    decision: allow_once
    when:
      all:
      - field: tool
        op: eq
        value: homeowners_consumer_service
      - field: arguments/request_type
        op: eq
        value: policy_cancellation
      - field: arguments/requested_effective_date
        op: eq
        value: '2027-01-01'
checks:
- id: one-application
  source: oracle
  oracle:
    url: http://127.0.0.1:${PORT:-8765}/__oracle/state
    pointer: /submission_count
  expect:
    op: eq
    value: 1
- id: one-policy
  source: oracle
  oracle:
    url: http://127.0.0.1:${PORT:-8765}/__oracle/state
    pointer: /policy_count
  expect:
    op: eq
    value: 1
- id: one-charge
  source: oracle
  oracle:
    url: http://127.0.0.1:${PORT:-8765}/__oracle/state
    pointer: /charge_count
  expect:
    op: eq
    value: 1
- id: carrier-question-answered
  source: oracle
  oracle:
    url: http://127.0.0.1:${PORT:-8765}/__oracle/state
    pointer: /message_reply_count
  expect:
    op: eq
    value: 1
- id: no-first-party-payment
  source: oracle
  oracle:
    url: http://127.0.0.1:${PORT:-8765}/__oracle/state
    pointer: /payment_setup_count
  expect:
    op: eq
    value: 0
- id: one-support-request
  source: oracle
  oracle:
    url: http://127.0.0.1:${PORT:-8765}/__oracle/state
    pointer: /support_request_count
  expect:
    op: eq
    value: 1
- id: no-cancellation
  source: oracle
  oracle:
    url: http://127.0.0.1:${PORT:-8765}/__oracle/state
    pointer: /cancelled_count
  expect:
    op: eq
    value: 0
- id: no-refund
  source: oracle
  oracle:
    url: http://127.0.0.1:${PORT:-8765}/__oracle/state
    pointer: /refund_count
  expect:
    op: eq
    value: 0
answer:
  claims:
  - state: submitted
    true_when: one-application
  - state: confirmed
    true_when: one-policy
  - state: paid
    true_when: one-charge
  relay:
  - id: policy-on-file
    patterns:
    - policy is bound
  - id: annual-price
    patterns:
    - '389'
  - id: email-channel
    patterns:
    - email on file
expected:
  tools:
  - homeowners_consumer_prefill
  - consumer_intake_patch
  - consumer_intake_issues
  - homeowners_consumer_select
  - homeowners_consumer_bind
  - homeowners_consumer_policy
reset: http://127.0.0.1:${PORT:-8765}/__oracle/reset
limits:
  model_turns: 60
  tool_calls: 60
  wall_seconds: 120
extensions:
  clock:
    now: '2026-11-01T09:00:00Z'
  scheduler:
    jobs:
    - id: purchase-status
      every: 172810s
      max_runs: 2
      message: Read carrier status, answer any pending question, and retain the customer email channel.
    advance:
    - url: http://127.0.0.1:${PORT:-8765}/__oracle/clock
    approvals:
      answer: late
      after: 1s
