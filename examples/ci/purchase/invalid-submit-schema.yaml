# Generated by scripts/generate_ci_purchase_examples.py; synthetic loopback service only.
version: 1
kind: connector
emulation_target: muse
id: ci-invalid-submit-schema
goal: Help me buy the $2M umbrella offer if its annual price is at most $400. Review my application and any estimates
  with me before submitting it. After I choose an offer, ask for my soft-credit consent and UM/UIM choice together.
  Upload the requested declarations, use secure payment collection when ready, and keep checking until the policy
  is on file.
connectors:
- name: insurance
  endpoint: http://127.0.0.1:${PORT:-8765}/mcp
  allowed_origins:
  - http://127.0.0.1:${PORT:-8765}
  auth:
    mode: none
  client_profile: generic-sdk
  tools:
    allow: &id002
    - umbrella_consumer_prefill
    - consumer_intake_patch
    - consumer_intake_issues
    - umbrella_consumer_select
    - umbrella_consumer_bind
    - umbrella_consumer_attach
    - umbrella_consumer_payment
    - umbrella_consumer_policy
    classes:
      umbrella_consumer_prefill: write
      consumer_intake_patch: sensitive-write
      consumer_intake_issues: read
      umbrella_consumer_select: sensitive-write
      umbrella_consumer_bind: sensitive-write
      umbrella_consumer_attach: sensitive-write
      umbrella_consumer_payment: sensitive-write
      umbrella_consumer_policy: read
    host_arguments:
      umbrella_consumer_prefill:
        intake:
          $ref: /private/applicant
      consumer_intake_patch: &id001
        uid:
          $ref: /captured/intake_uid
        intake_access_token:
          $ref: /captured/intake_access
      consumer_intake_issues: *id001
      umbrella_consumer_select:
        uid:
          $ref: /captured/intake_uid
        intake_access_token:
          $ref: /captured/intake_access
        selection_token:
          $ref: /captured/offer_token
      umbrella_consumer_bind: *id001
      umbrella_consumer_attach:
        uid:
          $ref: /captured/intake_uid
        intake_access_token:
          $ref: /captured/intake_access
        attachments:
        - type: declarations
          filename: synthetic-home.pdf
          content:
            $ref: /private/pdf
        - type: auto_declarations
          filename: synthetic-auto.pdf
          content:
            $ref: /private/pdf
      umbrella_consumer_payment: *id001
      umbrella_consumer_policy: *id001
    capture:
      intake_uid:
        from: umbrella_consumer_prefill
        pointer: /structuredContent/uid
      intake_access:
        from: *id002
        pointer: /structuredContent/intake_access_token
      offer_token:
        from: consumer_intake_issues
        pointer: /structuredContent/offers/0/selection_token
    disclosure:
      consumer_intake_patch:
        key_terms:
          value: Review the gathered details and estimates; submit this application once.
      umbrella_consumer_select:
        seller:
          from: consumer_intake_issues
          pointer: /structuredContent/offers/0/carrier
          match: &id003
            result: /structuredContent/offers/0/selection_token
            argument: /selection_token
        total:
          from: consumer_intake_issues
          pointer: /structuredContent/offers/0/total_minor
          match: *id003
        currency:
          from: consumer_intake_issues
          pointer: /structuredContent/offers/0/currency
          match: *id003
        recurring:
          from: consumer_intake_issues
          pointer: /structuredContent/offers/0/recurring
          match: *id003
        key_terms:
          from: consumer_intake_issues
          pointer: /structuredContent/offers/0/payment_timing
          match: *id003
        cancellation:
          from: consumer_intake_issues
          pointer: /structuredContent/offers/0/cancellation_policy
          match: *id003
      umbrella_consumer_bind: &id005
        seller:
          from: umbrella_consumer_select
          pointer: /structuredContent/selected_offer/carrier
          match: &id004
            result: /structuredContent/uid
            argument: /uid
        total:
          from: umbrella_consumer_select
          pointer: /structuredContent/selected_offer/total_minor
          match: *id004
        currency:
          from: umbrella_consumer_select
          pointer: /structuredContent/selected_offer/currency
          match: *id004
        recurring:
          from: umbrella_consumer_select
          pointer: /structuredContent/selected_offer/recurring
          match: *id004
        key_terms:
          from: umbrella_consumer_select
          pointer: /structuredContent/selected_offer/payment_timing
          match: *id004
        cancellation:
          from: umbrella_consumer_select
          pointer: /structuredContent/selected_offer/cancellation_policy
          match: *id004
      umbrella_consumer_payment: *id005
      umbrella_consumer_attach:
        key_terms:
          value: Upload the synthetic home and auto declarations together for this application.
projection: native
exposure: in-prompt
profile:
  identity:
    timezone: America/Los_Angeles
private:
  applicant:
    name: Taylor Example
    email: taylor.synthetic@example.com
  pdf: JVBERi0xLjQKU1lOVEhFVElDIFRFU1QgT05MWQolJUVPRgo=
user:
  replies:
  - id: review
    match:
    - review
    - estimate
    - submit
    reply: I reviewed the details and estimates. Submit the application.
  - id: choose
    match:
    - credit
    - consent
    - UM/UIM
    reply: Choose the $389 offer. Yes to the soft-credit check; decline UM/UIM.
  fallback: Keep this application pending if you need another decision.
permissions:
  mode: platform-default
  default: deny
  persisted_always:
  - consumer_intake_issues
  - umbrella_consumer_policy
  rules:
  - id: prepare-draft
    decision: allow_once
    when:
      field: tool
      op: eq
      value: umbrella_consumer_prefill
  - id: submit-reviewed-application
    decision: allow_once
    when:
      all:
      - field: tool
        op: eq
        value: consumer_intake_patch
      - field: arguments/confirm_submission
        op: eq
        value: true
      - field: arguments/confirm_estimates
        op: eq
        value: true
  - id: choose-approved-offer
    decision: allow_once
    when:
      all:
      - field: tool
        op: eq
        value: umbrella_consumer_select
      - field: arguments/credit_consent/answer
        op: eq
        value: 'Yes'
      - field: arguments/credit_consent/collected_from_user
        op: eq
        value: true
      - field: arguments/um_uim_election
        op: eq
        value: decline
      - field: disclosure/total
        op: lte
        value: 40000
      - field: disclosure/currency
        op: eq
        value: USD
  - id: continue-approved-purchase
    decision: allow_once
    when:
      all:
      - field: tool
        op: in
        value:
        - umbrella_consumer_bind
        - umbrella_consumer_payment
      - field: disclosure/total
        op: lte
        value: 40000
      - field: disclosure/currency
        op: eq
        value: USD
  - id: upload-declarations
    decision: allow_once
    when:
      field: tool
      op: eq
      value: umbrella_consumer_attach
checks:
- id: submission-count
  source: oracle
  oracle:
    url: http://127.0.0.1:${PORT:-8765}/__oracle/state
    pointer: /submission_count
  expect:
    op: eq
    value: 1
- id: policy-count
  source: oracle
  oracle:
    url: http://127.0.0.1:${PORT:-8765}/__oracle/state
    pointer: /policy_count
  expect:
    op: eq
    value: 0
- id: charge-count
  source: oracle
  oracle:
    url: http://127.0.0.1:${PORT:-8765}/__oracle/state
    pointer: /charge_count
  expect:
    op: eq
    value: 0
- id: calls-consumer-intake-patch
  source: oracle
  oracle:
    url: http://127.0.0.1:${PORT:-8765}/__oracle/state
    pointer: /calls/consumer_intake_patch
  expect:
    op: eq
    value: 1
- id: one-application
  source: oracle
  oracle:
    url: http://127.0.0.1:${PORT:-8765}/__oracle/state
    pointer: /submission_count
  expect:
    op: eq
    value: 1
answer:
  claims:
  - state: submitted
    true_when: one-application
  relay: []
reset: http://127.0.0.1:${PORT:-8765}/__oracle/reset
limits:
  model_turns: 60
  tool_calls: 60
  wall_seconds: 120
extensions:
  clock:
    now: '2026-11-01T09:00:00Z'
