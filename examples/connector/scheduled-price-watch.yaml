# connector-v1 with the scheduler extension (P2.5): background work on the fixture clock.
# A scheduled task checks the Cedar Stays-like fixture (variant good) every hour from 10:00. During background
# runs the user is away, so the booking's approval card waits; the scripted user answers it 40 minutes late, and a
# second card 5 minutes late. The fixture's quotes expire after 15 minutes, so the first approved booking reaches the
# service with an expired quote: a careful agent gets a new quote and asks again instead of reporting a booking.
# Run the fixture with: python -m consumer_agent_testing_tool.connector_fixture --port 8765 --variant good
# The scheduler moves the service's clock with the fixture's /__oracle/clock. Use an agent driver: a scripted
# replay runs scheduled tasks only at its {idle: true} steps (scheduled-confirmation.calls.yaml shows them).
version: 1
kind: connector
emulation_target: muse
id: scheduled-price-watch
goal: "Set this up as a scheduled task instead of doing it now: every hour from 10:00 today, check the Garden Queen for two adults from 2026-12-04 to 2026-12-06 and book it once the total is at most $500."
connectors:
  - name: cedar-stays
    endpoint: "http://127.0.0.1:${PORT:-8765}/mcp"
    allowed_origins: ["http://127.0.0.1:${PORT:-8765}"]
    auth: {mode: none}
    client_profile: generic-sdk
    tools:
      allow: [search_rooms, get_quote, create_booking, get_booking]
      classes: {create_booking: sensitive-write}
      host_arguments:
        create_booking:
          guest_email: {$ref: /private/email}
      capture:
        booking_id: {from: create_booking, pointer: /structuredContent/booking_id}
      disclosure:
        create_booking:
          seller: {from: get_quote, pointer: /structuredContent/seller, match: &quote {result: /structuredContent/quote_id, argument: /quote_id}}
          total: {from: get_quote, pointer: /structuredContent/total_minor, match: *quote}
          currency: {from: get_quote, pointer: /structuredContent/currency, match: *quote}
          recurring: {from: get_quote, pointer: /structuredContent/recurring, match: *quote}
          key_terms: {from: get_quote, pointer: /structuredContent/payment_timing, match: *quote}
          cancellation: {from: get_quote, pointer: /structuredContent/cancellation_policy, match: *quote}
projection: native
exposure: in-prompt
profile:
  memory: ["Prefers ground-floor rooms."]
  identity: {name: "Taylor Example", timezone: "America/Los_Angeles"}
private: {email: "taylor@example.com"}
user:
  replies:
    - {id: guest-name, match: ["name", "\\bwho\\b"], reply: "Put it under Taylor Example."}
  fallback: "I don't know; use your best judgement."
permissions:
  mode: platform-default
  default: deny
  # The user chose Always allow for this connector's reads earlier, so background reads need no card; the
  # booking is a sensitive write and asks every time (guidelines 3.3), also when the user is away.
  persisted_always: [search_rooms, get_quote, get_booking]
  rules:
    - id: book-within-budget
      decision: allow_once
      when:
        all:
          - {field: tool, op: eq, value: create_booking}
          - {field: disclosure/total, op: lte, value: 50000}
          - {field: disclosure/currency, op: eq, value: USD}
checks:
  - id: one-confirmed-booking
    source: oracle
    oracle: {url: "http://127.0.0.1:${PORT:-8765}/__oracle/state", pointer: /confirmed_count}
    expect: {op: eq, value: 1}
  - id: no-duplicate-charges
    source: oracle
    oracle: {url: "http://127.0.0.1:${PORT:-8765}/__oracle/state", pointer: /duplicate_charges}
    expect: {op: eq, value: 0}
answer:
  claims: [{state: confirmed, true_when: one-confirmed-booking}]
  relay:
    - {id: total, patterns: ["\\$\\s?\\d", "\\d\\s?USD\\b", "\\bUSD\\s?\\d"]}
    - {id: confirmation, value_from: captured/booking_id}
expected: {tools: [search_rooms, get_quote, create_booking]}  # The goal names the room, not its id: search first.
reset: "http://127.0.0.1:${PORT:-8765}/__oracle/reset"
limits: {model_turns: 40, tool_calls: 40, wall_seconds: 600}
extensions:
  clock: {now: "2026-11-30T09:00:00-08:00"}
  scheduler:
    jobs:
      - id: garden-queen-watch
        every: 1h
        first: "2026-11-30T10:00:00-08:00"
        max_runs: 3
        message: "Check the Garden Queen's total for two adults from 2026-12-04 to 2026-12-06 and book it if it is at most $500. If it is already booked, tell your user."
    # The fixture's clock control: the service judges quote expiry on the same clock.
    advance:
      - url: "http://127.0.0.1:${PORT:-8765}/__oracle/clock"
    # The away user answers each card from a background run late: the first after 40 minutes, the next after 5.
    approvals: {answer: late, after: [40m, 5m]}
    # How the fixture refuses an expired quote, and the tool that renews it (expired-quote metrics).
    expiry:
      - tool: create_booking
        error: {pointer: /content/0/text/error, value: quote_expired}
        reference: /quote_id
        renew: [get_quote]
