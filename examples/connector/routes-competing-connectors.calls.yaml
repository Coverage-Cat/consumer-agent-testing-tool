# Scripted calls for routes-competing-connectors.yaml (--driver scripted): search, quote and book at the hotel's
# own connector (with several connectors, native tools are <connector>__<tool>), never through the agency. They
# reference earlier results by JSON pointer (/results/<step>/...), so they assume the fixture's result shapes.
#
#   .venv/bin/python -m consumer_agent_testing_tool.connector_fixture --port 8765 --variant good --auth none &
#   .venv/bin/python -m consumer_agent_testing_tool.connector_fixture --port 8766 \
#     --config examples/connector/routes-competing-connectors.fixture.yaml &
#   .venv/bin/consumer-agent-testing-tool connector-run examples/connector/routes-competing-connectors.yaml \
#     --driver scripted --script examples/connector/routes-competing-connectors.calls.yaml
- {tool: cedar-stays__search_rooms, arguments: {check_in: "2026-12-04", check_out: "2026-12-06", adults: 2}}
- tool: cedar-stays__get_quote
  arguments: {room_id: rm-garden-queen, check_in: "2026-12-04", check_out: "2026-12-06", adults: 2}
- tool: cedar-stays__create_booking
  arguments: {quote_id: {$ref: /results/1/result/structuredContent/quote_id}, guest_name: Taylor Example}
- answer:
    - "Booked: the Garden Queen at Cedar Stays for December 4 to 6, 2026, confirmation "
    - {$ref: /results/2/result/structuredContent/booking_id}
    - "; total "
    - {$ref: /results/1/result/structuredContent/total_minor}
    - " USD in minor units, as quoted."
