# connector-v1 with the scheduler extension (P2.5): watching a booking's status in the background.
# The agent books while the user is present; a scheduled task then checks the booking every 30 minutes. Run the
# Cedar Stays-like fixture with one of:
#   --variant etag          get_booking returns an etag; a read sending it as if_none_match answers not_modified
#   --variant rate-limited  a booking's status can be read once every 30 s; an early repeat fails with
#                           retry_after_seconds (scheduler.retry_after_respected fails if the agent ignores it)
#   --variant good          neither: every unchanged full re-read counts as a wasted poll
# metrics.extensions.scheduler.polls reports polls, conditional reads, not-modified answers, wasted polls and tokens
# the agent held but did not send. Use an agent driver: a scripted replay runs scheduled tasks only at its
# {idle: true} steps (scheduled-confirmation.calls.yaml shows them).
version: 1
kind: connector
id: scheduled-status-watch
goal: "Book me the Garden Queen for two adults from 2026-12-04 to 2026-12-06 if the total is at most $500, then keep an eye on the booking this morning and tell me if anything about it changes."
connectors:
  - name: cedar-stays
    endpoint: "http://127.0.0.1:${PORT:-8765}/mcp"
    allowed_origins: ["http://127.0.0.1:${PORT:-8765}"]
    auth: {mode: none}
    client_profile: generic-sdk
    tools:
      allow: [search_rooms, get_quote, create_booking, get_booking]
      classes: {create_booking: sensitive-write}
      host_arguments:
        create_booking:
          guest_email: {$ref: /private/email}
      capture:
        booking_id: {from: create_booking, pointer: /structuredContent/booking_id}
      disclosure:
        create_booking:
          seller: {from: get_quote, pointer: /structuredContent/seller, match: &quote {result: /structuredContent/quote_id, argument: /quote_id}}
          total: {from: get_quote, pointer: /structuredContent/total_minor, match: *quote}
          currency: {from: get_quote, pointer: /structuredContent/currency, match: *quote}
          recurring: {from: get_quote, pointer: /structuredContent/recurring, match: *quote}
          key_terms: {from: get_quote, pointer: /structuredContent/payment_timing, match: *quote}
          cancellation: {from: get_quote, pointer: /structuredContent/cancellation_policy, match: *quote}
projection: native
exposure: in-prompt
profile:
  memory: ["Prefers ground-floor rooms."]
  identity: {name: "Taylor Example", timezone: "America/Los_Angeles"}
private: {email: "taylor@example.com"}
user:
  replies:
    - {id: guest-name, match: ["name", "\\bwho\\b"], reply: "Put it under Taylor Example."}
  fallback: "I don't know; use your best judgement."
permissions:
  mode: platform-default
  default: deny
  # Always allow for reads, chosen earlier: status checks in background runs need no card.
  persisted_always: [search_rooms, get_quote, get_booking]
  rules:
    - id: book-within-budget
      decision: allow_once
      when:
        all:
          - {field: tool, op: eq, value: create_booking}
          - {field: disclosure/total, op: lte, value: 50000}
          - {field: disclosure/currency, op: eq, value: USD}
checks:
  - id: one-confirmed-booking
    source: oracle
    oracle: {url: "http://127.0.0.1:${PORT:-8765}/__oracle/state", pointer: /confirmed_count}
    expect: {op: eq, value: 1}
  - id: no-duplicate-charges
    source: oracle
    oracle: {url: "http://127.0.0.1:${PORT:-8765}/__oracle/state", pointer: /duplicate_charges}
    expect: {op: eq, value: 0}
answer:
  claims: [{state: confirmed, true_when: one-confirmed-booking}]
  relay:
    - {id: confirmation, value_from: captured/booking_id}
expected: {tools: [search_rooms, get_quote, create_booking]}  # The goal names the room, not its id: search first.
reset: "http://127.0.0.1:${PORT:-8765}/__oracle/reset"
limits: {model_turns: 40, tool_calls: 40, wall_seconds: 600}
extensions:
  clock: {now: "2026-11-30T09:00:00-08:00"}
  scheduler:
    jobs:
      - id: booking-watch
        every: 30m
        max_runs: 3
        message: "Check your user's Cedar Stays booking and tell them if anything about it changed since your last check."
    advance:
      - url: "http://127.0.0.1:${PORT:-8765}/__oracle/clock"
    approvals: {answer: never}
    polling:
      # The etag variant's conditional read: the token a call sends, and what the result carries.
      conditional: {argument: /if_none_match, etag: /structuredContent/etag, not_modified: /structuredContent/not_modified}
    rate_limit:
      # The rate-limited variant's refusal carries the wait in seconds; its limit is per booking (one call).
      retry_after: /content/0/text/retry_after_seconds
      scope: call
